<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Transaction History</h2>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Wallet ID</th>
            <th>Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transaction : ${transactions}">
            <td th:text="${transaction.id}"></td>
            <td th:text="${transaction.wallet.id}"></td>
            <td th:text="${transaction.transactionAmount}"></td>
        </tr>
        </tbody>
    </table>

    <nav>
        <ul class="pagination">
            <li class="page-item" th:classappend="${transactions.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{|/wallets/${walletId}/transactions?page=${transactions.number - 1}&size=${transactions.size}|}">
                    Previous
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, transactions.totalPages - 1)}"
                th:classappend="${i == transactions.number} ? 'active'">
                <a class="page-link"
                   th:href="@{|/wallets/${walletId}/transactions?page=${i}&size=${transactions.size}|}"
                   th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${transactions.hasNext()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{|/wallets/${walletId}/transactions?page=${transactions.number + 1}&size=${transactions.size}|}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
